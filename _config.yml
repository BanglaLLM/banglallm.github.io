title: BanglaLLM
theme: null
# `tagline` is what jekyll-seo-tag appends to <title>. Keep the whole title
# under ~60 characters or Google truncates it in results.
tagline: "Open Bangla and Bengali language model research"
tagline_bn: "বাংলা ভাষার জন্য উন্মুক্ত এআই গবেষণা"
tagline_en: "Open AI research for the Bangla language"
description: "Open research on Bangla (Bengali) language models: BanglaLlama, instruction datasets, and BanglaSafe, our EMNLP 2026 safety benchmark. Free to download."
url: "https://banglallm.github.io"
baseurl: ""

github_url: "https://github.com/banglallm"
huggingface_url: "https://huggingface.co/BanglaLLM"
contact_email: "brishtiteveja@gmail.com"

markdown: kramdown

logo: /assets/apple-touch-icon.png
image: /assets/og-image.png

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Google Search Console's verification file must be served byte for byte, so it
# carries no front matter. Keep it out of the sitemap from here instead.
defaults:
  - scope:
      path: "google2d36de6fcb122608.html"
    values:
      sitemap: false

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - docs
  - .claude
  - .agents
  - skills-lock.json
