published:
  - year: 2026
    venue: "Findings of EMNLP 2026"
    title_bn: "Register Shifts Break LLM Safety: সাংস্কৃতিকভাবে প্রোথিত ক্ষতি নিয়ে একটি বাংলা বেঞ্চমার্ক"
    title_en: "Register Shifts Break LLM Safety: A Bengali Benchmark with Culturally Grounded Harms"
    authors:
      - { name: "Naymul Islam", lab: true, equal: true }
      - { name: "Nusrat Jahan Lia", lab: true, equal: true }
      - { name: "Shubhashis Roy Dipta", lab: true, equal: true }
      - { name: "Sabik Bin Sultan", lab: true }
      - { name: "Abdullah Khan Zehady", lab: true }
    arxiv: "https://arxiv.org/abs/2608.22335"
    acl: null
    project: "https://banglallm.github.io/banglasafe/"
    code: "https://github.com/BanglaLLM/banglasafe"
    dataset: "https://huggingface.co/datasets/BanglaLLM/BanglaSafe"
    figure: "/assets/figures/banglasafe-register-effect.png"
    figure_alt: "Bar chart comparing how often models answered the same harmful question written five different ways. Newspaper-style Bengali is highest at 63.3 percent and casual Banglish is lowest at 45.8 percent."
    figure_caption_en: "The same harmful question, written five different ways. In the style of a newspaper article it gets answered 17.5 points more often than in the style of a casual text message. Both are Bengali, so what changed is the tone, not the language."
    figure_caption_bn: "একই ক্ষতিকর প্রশ্ন, পাঁচ রকমভাবে লেখা। খবরের কাগজের ভাষায় লিখলে সাধারণ খুদে বার্তার ভাষার চেয়ে ১৭.৫ পয়েন্ট বেশিবার উত্তর মেলে। দুটোই বাংলা, তাই বদলেছে কেবল ভঙ্গি, ভাষা নয়।"
    note_bn: "আমরা ৮৭৯টি ক্ষতিকর প্রশ্ন ইংরেজি থেকে অনুবাদ না করে সরাসরি বাংলায় লিখেছি। প্রশ্নগুলো ১৭ ধরনের ক্ষতির আওতায় পড়ে, যেগুলোকে বাংলাদেশের আইন অপরাধ বলে গণ্য করে। প্রশ্ন একই রেখে কেবল লেখার ধরন বদলালে মডেল ১৭.৫ পয়েন্ট বেশিবার উত্তর দেয়। ১৮টি মডেলের ১৫,৮২২টি উত্তরের উপর মাপা, প্রতিটি উত্তর চার ধাপের মাপকাঠিতে যাচাই করা, যা মানুষের দেওয়া নম্বরের সঙ্গে মিলিয়ে দেখা হয়েছে।"
    note_en: "We wrote 879 harmful questions in Bengali rather than translating them from English, covering 17 kinds of harm that Bangladeshi law treats as a crime. Keep the question the same and change only how it is written, and models answer 17.5 points more often. Measured over 15,822 answers from 18 models, each graded on a four-point scale that was checked against human graders."

  - year: 2026
    venue: "LoResLM @ EACL 2026"
    title_bn: "BanglaLlama: বাংলা ভাষার জন্য LLaMA"
    title_en: "BanglaLlama: LLaMA for Bangla Language"
    authors:
      - { name: "Abdullah Khan Zehady", lab: true }
      - { name: "Shubhashis Roy Dipta", lab: true }
      - { name: "Naymul Islam", lab: true }
      - { name: "Safi Al Mamun", lab: true }
      - { name: "Santu Karmaker", lab: true }
    arxiv: "https://arxiv.org/abs/2410.21200"
    acl: null
    note_bn: "দুটি বাংলা প্রশিক্ষণ ডেটাসেট তৈরি করা হয়েছে: Bangla-Alpaca, ৫২ হাজার উদাহরণ, এবং Bangla-Orca, ১৭২ হাজার। সেগুলো দিয়ে বানানো ৫টি BanglaLlama মডেলও উন্মুক্ত করা হয়েছে।"
    note_en: "Introduces two Bangla training sets, Bangla-Alpaca with 52,000 examples and Bangla-Orca with 172,000, and releases 5 BanglaLlama models built with them."

  - year: 2025
    venue: "BLP @ IJCNLP-AACL 2025"
    title_bn: "Read Between the Lines: বাংলা সংবাদে রাজনৈতিক পক্ষপাত উন্মোচনের একটি বেঞ্চমার্ক"
    title_en: "Read Between the Lines: A Benchmark for Uncovering Political Bias in Bangla News Articles"
    authors:
      - { name: "Nusrat Jahan Lia", lab: true }
      - { name: "Shubhashis Roy Dipta", lab: true }
      - { name: "Abdullah Khan Zehady", lab: true }
      - { name: "Naymul Islam", lab: true }
      - { name: "Madhusodan Chakraborty", lab: true }
      - { name: "Abdullah Al Wasif", lab: false }
    arxiv: "https://arxiv.org/abs/2510.03898"
    acl: "https://aclanthology.org/2025.banglalp-1.5/"
    note_bn: "BanglaBias, ২০০টি বাংলা সংবাদ নিবন্ধ। প্রতিটিকে চিহ্নিত করা হয়েছে সরকারপন্থী, সরকার-সমালোচক বা নিরপেক্ষ হিসেবে। ২৮টি ভাষা-মডেল এই পার্থক্য কতটা ধরতে পারে, আমরা তা যাচাই করেছি।"
    note_en: "BanglaBias, 200 Bangla news articles, each labeled as leaning towards the government, critical of it, or neutral. We tested 28 language models on how well they could tell the difference."

