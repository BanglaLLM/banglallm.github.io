published:
  - year: 2026
    venue: "Findings of EMNLP 2026"
    title_bn: "Register Shifts Break LLM Safety: সাংস্কৃতিকভাবে প্রোথিত ক্ষতি নিয়ে একটি বাংলা বেঞ্চমার্ক"
    title_en: "Register Shifts Break LLM Safety: A Bengali Benchmark with Culturally Grounded Harms"
    authors:
      - { name: "Naymul Islam", lab: true, equal: true }
      - { name: "Nusrat Jahan Lia", lab: true, equal: true }
      - { name: "Shubhashis Roy Dipta", lab: true, equal: true }
      - { name: "Sabik Bin Sultan", lab: true }
      - { name: "Abdullah Khan Zehady", lab: true }
    arxiv: "https://arxiv.org/abs/2608.22335"
    acl: null
    project: "https://banglallm.github.io/banglasafe/"
    code: "https://github.com/BanglaLLM/banglasafe"
    dataset: "https://huggingface.co/datasets/BanglaLLM/BanglaSafe"
    figure: "/assets/figures/banglasafe-register-effect.png"
    figure_alt: "Bar chart of attack success rate across five prompting conditions; Bengali formal journalism is highest at 63.3 percent and colloquial Banglish peer-help lowest at 45.8 percent."
    figure_caption_en: "The same harmful request in five framings. Written as formal Bengali journalism it is answered 17.5 points more often than as a casual Banglish message. Both are Bengali, so the gap is register, not language."
    figure_caption_bn: "একই ক্ষতিকর অনুরোধ পাঁচটি ভিন্ন ঢঙে। আনুষ্ঠানিক বাংলা সাংবাদিকতার ভাষায় লিখলে সেটি সাধারণ বাংলিশ বার্তার চেয়ে ১৭.৫ পয়েন্ট বেশি উত্তর পায়। দুটোই বাংলা, তাই পার্থক্যটা ভাষার নয়, ঢঙের।"
    note_bn: "BanglaSafe, বাংলাদেশের আইনের সঙ্গে যুক্ত ১৭টি ক্ষতির শ্রেণিতে ৮৭৯টি বাংলা প্রম্পট। একই অনুরোধ রেখে শুধু লেখার ঢং বদলে দিলে মডেলের সাড়া দেওয়ার হার ১৭.৫ পয়েন্ট বাড়ে, ১৮টি মডেলের ১৫,৮২২টি উত্তরের উপর মাপা।"
    note_en: "BanglaSafe, 879 natively written Bengali prompts across 17 harm categories anchored to Bangladeshi law. Holding a request fixed and changing only its register moves compliance by 17.5 points, measured over 15,822 responses from 18 models with a calibrated four-way judge."

