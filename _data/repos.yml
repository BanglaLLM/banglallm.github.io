- name: "banglasafe"
  body_en: "Run the BanglaSafe safety test against any model you can reach through an OpenAI-style API. Install it with pip install banglasafe."
  body_bn: "OpenAI-ধাঁচের API দিয়ে পৌঁছানো যায় এমন যেকোনো মডেলে BanglaSafe নিরাপত্তা পরীক্ষা চালান। pip install banglasafe দিয়ে ইনস্টল করুন।"
  link: "https://github.com/BanglaLLM/banglasafe"

- name: "bangla-llama"
  body_en: "The notebooks we used to train the BanglaLlama models, covering LLaMA 2, 3, 3.1 and 3.2, Mistral, Mixtral and Unsloth."
  body_bn: "BanglaLlama মডেলগুলো প্রশিক্ষণের নোটবুক। LLaMA 2, 3, 3.1, 3.2, Mistral, Mixtral ও Unsloth।"
  link: "https://github.com/banglallm/bangla-llama"

- name: "s1-bengali"
  body_en: "Code for giving a model more time to reason through a problem in Bengali."
  body_bn: "বাংলায় কোনো সমস্যা নিয়ে মডেলকে বেশি সময় ভাবতে দেওয়ার কোড।"
  link: "https://github.com/banglallm/s1-bengali"

- name: "lm-evaluation-harness"
  body_en: "Our fork of a widely used model-testing framework, with Bangla tasks added."
  body_bn: "মডেল যাচাইয়ের একটি প্রচলিত ফ্রেমওয়ার্কের আমাদের সংস্করণ, বাংলা টাস্ক যোগ করা।"
  link: "https://github.com/banglallm/lm-evaluation-harness"

- name: "BanglaDataManager"
  body_en: "Tools for keeping our Bangla training data organized."
  body_bn: "আমাদের বাংলা প্রশিক্ষণ ডেটা গুছিয়ে রাখার সরঞ্জাম।"
  link: "https://github.com/banglallm/BanglaDataManager"

- name: "bd-newspaper-crawlers"
  body_en: "Scripts that collect articles from Bangla news sites and blogs."
  body_bn: "বাংলা সংবাদ সাইট ও ব্লগ থেকে লেখা সংগ্রহ করার স্ক্রিপ্ট।"
  link: "https://github.com/banglallm/bd-newspaper-crawlers"

- name: "Open-Translator"
  body_en: "An open-source translation tool."
  body_bn: "একটি উন্মুক্ত অনুবাদ সরঞ্জাম।"
  link: "https://github.com/banglallm/Open-Translator"

- name: "youtube_bangla"
  body_en: "Ask questions about a Bangla YouTube video and get answers drawn from what was said in it."
  body_bn: "বাংলা ইউটিউব ভিডিও নিয়ে প্রশ্ন করুন, ভিডিওতে যা বলা হয়েছে তা থেকেই উত্তর পান।"
  link: "https://github.com/banglallm/youtube_bangla"

- name: "OpenMAIC"
  body_en: "A classroom app where several AI agents teach together."
  body_bn: "একটি ক্লাসরুম অ্যাপ, যেখানে কয়েকটি এআই এজেন্ট একসঙ্গে পড়ায়।"
  link: "https://github.com/banglallm/OpenMAIC"
