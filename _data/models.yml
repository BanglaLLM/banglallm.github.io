families:
  - name_bn: "BanglaLlama পরিবার"
    name_en: "BanglaLlama family"
    desc_bn: "Llama 2, 3, 3.1 ও 3.2 বাংলা দিয়ে আবার প্রশিক্ষিত, ১বি থেকে ১৩বি প্যারামিটার পর্যন্ত। প্রতিটি মাপের সাধারণ সংস্করণ আছে, আর নির্দেশ মেনে চলার জন্য আলাদা সংস্করণও আছে।"
    desc_en: "Llama 2, 3, 3.1 and 3.2 retrained on Bangla, from 1B to 13B parameters. Each size comes in a plain version and one tuned to follow instructions."
    url: "https://huggingface.co/BanglaLLM"

  - name_bn: "Bangla-s1k পরিবার"
    name_en: "Bangla-s1k family"
    desc_bn: "উত্তর দেওয়ার আগে ধাপে ধাপে ভাবার জন্য বেশি সময় পায় এমন মডেল, বাংলার জন্য মানিয়ে নেওয়া। Qwen-2.5 (৩বি ও ৩২বি) এবং QWQ-32B-এর উপর তৈরি।"
    desc_en: "Models given more time to think before they answer, adapted for Bengali. Built on Qwen-2.5 at 3B and 32B, and on QWQ-32B."
    url: "https://huggingface.co/BanglaLLM"

datasets:
  - name: "BanglaSafe"
    keywords: ["Bengali", "Bangla", "LLM safety", "safety benchmark", "red teaming", "harm taxonomy", "Bangladesh", "low-resource language"]
    citation: "https://arxiv.org/abs/2608.22335"
    license: "https://creativecommons.org/licenses/by/4.0/"
    size_bn: "৮৭৯টি প্রশ্ন"
    size_en: "879 questions"
    desc_bn: "বাংলায় নিরাপত্তা যাচাইয়ের প্রশ্নপত্র। বাংলাদেশের আইন থেকে নেওয়া ১৭ ধরনের ক্ষতি, প্রতিটি প্রশ্ন পাঁচ রকম ভঙ্গিতে লেখা। EMNLP 2026 Findings গবেষণা থেকে।"
    desc_en: "A safety test set in Bengali. 17 kinds of harm taken from Bangladeshi law, with each question written in five different styles. From the EMNLP 2026 Findings paper."
    url: "https://huggingface.co/datasets/BanglaLLM/BanglaSafe"
  - name: "bangla-alpaca-orca"
    keywords: ["Bengali", "Bangla", "instruction tuning", "instruction dataset", "Alpaca", "Orca", "low-resource language"]
    license: "https://www.gnu.org/licenses/gpl-3.0.html"
    size_bn: "১,৭২,০০০ উদাহরণ"
    size_en: "172,000 examples"
    desc_bn: "বাংলা প্রশ্ন ও তার উত্তর, মডেলকে নির্দেশ মেনে চলতে শেখানোর জন্য। Alpaca ও Orca একসঙ্গে।"
    desc_en: "Bangla questions paired with answers, used to teach a model to follow instructions. Alpaca and Orca combined."
    url: "https://huggingface.co/datasets/BanglaLLM/bangla-alpaca-orca"
  - name: "bangla-alpaca"
    keywords: ["Bengali", "Bangla", "instruction tuning", "instruction dataset", "Alpaca", "low-resource language"]
    license: "https://www.gnu.org/licenses/gpl-3.0.html"
    size_bn: "৫২,০০০ উদাহরণ"
    size_en: "52,000 examples"
    desc_bn: "Alpaca নির্দেশনার ডেটাসেট বাংলায় অনুবাদ করা।"
    desc_en: "The Alpaca instruction set translated into Bangla."
    url: "https://huggingface.co/datasets/BanglaLLM/bangla-alpaca"
  - name: "bangla_math_by_Ashrafur"
    keywords: ["Bengali", "Bangla", "mathematics", "math reasoning", "word problems", "low-resource language"]
    size_bn: "৮,৫৯,০০০ উদাহরণ"
    size_en: "859,000 examples"
    desc_bn: "বাংলায় গণিতের সমস্যা, সঙ্গে সমাধান কীভাবে করতে হয় তা দেখানো।"
    desc_en: "Math problems in Bangla, with the solutions worked out."
    url: "https://huggingface.co/datasets/BanglaLLM/bangla_math_by_Ashrafur"

summary_bn: "নিচের সব কিছু HuggingFace থেকে বিনামূল্যে নামানো যায়: ৩১টি মডেল ও ৮টি ডেটাসেট।"
summary_en: "Everything below is free to download from HuggingFace: 31 models and 8 datasets."
