families:
  - name_bn: "BanglaLlama পরিবার"
    name_en: "BanglaLlama family"
    desc_bn: "Llama 3 / 3.1 / 3.2 এর উপর ভিত্তি করে। বেস এবং ইনস্ট্রাকশন-টিউনড, ৩বি থেকে ১১বি পর্যন্ত।"
    desc_en: "Built on Llama 3 / 3.1 / 3.2. Base and instruction-tuned, from 3B to 11B."
    url: "https://huggingface.co/BanglaLLM"

  - name_bn: "Bangla-s1k পরিবার"
    name_en: "Bangla-s1k family"
    desc_bn: "বাংলা ভাষার জন্য টেস্ট-টাইম স্কেলিং, Qwen-2.5 (3B/32B) এবং QWQ-32B ভিত্তিক।"
    desc_en: "Test-time scaling adapted for Bengali, built on Qwen-2.5 (3B/32B) and QWQ-32B."
    url: "https://huggingface.co/BanglaLLM"

datasets:
  - name: "bangla-alpaca-orca"
    size_bn: "১৭২k উদাহরণ"
    size_en: "172k examples"
    desc_bn: "Alpaca ও Orca মিশ্রিত বাংলা ইনস্ট্রাকশন ডেটাসেট।"
    desc_en: "Mixed Alpaca + Orca Bangla instruction dataset."
    url: "https://huggingface.co/datasets/BanglaLLM/bangla-alpaca-orca"
  - name: "banglasafe"
    size_bn: "৮৭৯টি প্রম্পট"
    size_en: "879 prompts"
    desc_bn: "বাংলাদেশ-নির্দিষ্ট আইনের ভিত্তিতে তৈরি প্রথম বাংলায় নিরাপত্তা মূল্যায়ন বেঞ্চমার্ক।"
    desc_en: "The first Bengali safety evaluation benchmark, grounded in Bangladesh-specific statutory law."
    url: "https://huggingface.co/datasets/BanglaLLM/BanglaSafe"
  - name: "bangla-alpaca"
    size_bn: "৫২k উদাহরণ"
    size_en: "52k examples"
    desc_bn: "বাংলায় অনুবাদিত Alpaca ইনস্ট্রাকশন ডেটাসেট।"
    desc_en: "Alpaca-style Bangla instruction dataset."
    url: "https://huggingface.co/datasets/BanglaLLM/bangla-alpaca"
  - name: "bangla_math"
    size_bn: "৮৫৯k উদাহরণ"
    size_en: "859k examples"
    desc_bn: "বাংলায় গণিত সমস্যা ও সমাধান।"
    desc_en: "Bengali math problems and solutions."
    url: "https://huggingface.co/datasets/BanglaLLM"

summary_bn: "HuggingFace-এ ৩১টির বেশি মডেল এবং ৭টি ডেটাসেট উন্মুক্ত।"
summary_en: "Over 31 open models and 7 datasets on HuggingFace."
