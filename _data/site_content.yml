about:
  bn: >
    BanglaLLM একটি স্বাধীন, উন্মুক্ত গবেষণা সমষ্টি। বাংলা ভাষার জন্য ভাষা-মডেল তৈরি করা আমাদের লক্ষ্য। আমরা মনে করি, একটি ভাষাকে "পরে যোগ করা" ভাষা হিসেবে দেখা আর একে প্রথম দিন থেকে বিবেচনায় রাখা, এই দুইয়ের মধ্যে পার্থক্য বিশাল। এই পার্থক্য সব জায়গায় ধরা পড়ে: মডেল কী জানে তাতে, তাকে কতটা ঠিকভাবে মাপা হয় তাতে, এবং বাংলায় অনুরোধ এলে তার নিরাপত্তা-প্রশিক্ষণ আদৌ টিকে থাকে কি না তাতে। তাই আমরা মডেল, ডেটাসেট, বেঞ্চমার্ক ও নিরাপত্তা মূল্যায়ন, সব কিছু বাংলাকে মাথায় রেখে তৈরি করি এবং সম্পূর্ণ উন্মুক্তভাবে প্রকাশ করি।
  en: >
    BanglaLLM is an independent, open research effort building language models for Bangla. We think there's a real difference between treating a language as an afterthought and designing for it from day one. That difference shows up everywhere: in what a model knows, in how well anyone can measure it, and in whether its safety training survives a request written in Bengali. So we build models, datasets, benchmarks, and safety evaluations with Bangla in mind, and we release everything openly.

themes:
  - name_bn: "ভিত্তি-মডেল"
    name_en: "Foundation models"
    body_bn: >
      Llama ও Qwen-এর উপর ভিত্তি করে বাংলা ভাষার জন্য নতুন টোকেনাইজেশন, প্রাক-প্রশিক্ষণ ও ইনস্ট্রাকশন-টিউনিং। BanglaLlama পরিবারে ১বি থেকে ১৩বি পর্যন্ত বিভিন্ন মাপের মডেল, সব HuggingFace-এ উন্মুক্ত।
    body_en: >
      New tokenization, continued pre-training, and instruction-tuning for Bangla, built on Llama and Qwen. The BanglaLlama family ranges from 1B to 13B; all released openly on HuggingFace.
  - name_bn: "নিরাপত্তা ও অ্যালাইনমেন্ট"
    name_en: "Safety and alignment"
    body_bn: >
      ইংরেজিতে করা নিরাপত্তা-প্রশিক্ষণ বাংলায় অবিকৃতভাবে কাজ করে না। আমাদের EMNLP 2026 Findings গবেষণা BanglaSafe দেখায়, একই ক্ষতিকর অনুরোধ রেখে শুধু লেখার ঢং বদলে দিলে মডেলের সাড়া দেওয়ার হার ১৭.৫ পয়েন্ট বেড়ে যায়। এই ধরনের ব্যর্থতা মাপার জন্য প্রয়োজনীয় বেঞ্চমার্ক ও বাংলাদেশের আইন-ভিত্তিক ক্ষতির শ্রেণিবিন্যাস আমরা তৈরি করি।
    body_en: >
      Safety training done in English does not carry over cleanly to Bengali. BanglaSafe, our EMNLP 2026 Findings paper, shows that holding a harmful request fixed and changing only how it is written moves model compliance by 17.5 points. We build the benchmarks and the Bangladesh-law-anchored harm taxonomies that make failures like this measurable.
  - name_bn: "মূল্যায়ন ও বেঞ্চমার্ক"
    name_en: "Evaluation and benchmarks"
    body_bn: >
      বাংলা ভাষায় মডেলের কাজ কতটুকু ভালো তা মাপার পদ্ধতি এখনও অনেকটা অনুপস্থিত। আমরা রাজনৈতিক পক্ষপাত সনাক্তকরণ, গণিত যুক্তি, এবং পরীক্ষার-সময় স্কেলিং-এর মতো ক্ষেত্রে বেঞ্চমার্ক তৈরি করছি, সঙ্গে সেগুলো চালানোর জন্য উন্মুক্ত টুলিং।
    body_en: >
      Measuring how well a model actually performs in Bangla is still largely an open question. We're building benchmarks around political-bias detection, mathematical reasoning, and test-time scaling, along with the open tooling to run them.
  - name_bn: "ডেটা অবকাঠামো"
    name_en: "Data infrastructure"
    body_bn: >
      ভালো মডেলের জন্য ভালো ডেটা দরকার, এবং বাংলার জন্য সেই ডেটা নিজেদের তৈরি করতে হয়। সংবাদ ক্রলার, অনুবাদ করা ইনস্ট্রাকশন ডেটাসেট (Bangla-Alpaca, Bangla-Orca), গণিতের ডেটাসেট, সব উন্মুক্ত।
    body_en: >
      Good models need good data, and for Bangla we've had to build most of it ourselves. News crawlers, translated instruction datasets (Bangla-Alpaca, Bangla-Orca), math datasets, all open.
  - name_bn: "গবেষণা থেকে পণ্যে"
    name_en: "Research to product"
    body_bn: >
      বেঞ্চে পড়ে থাকা গবেষণার চেয়ে মানুষের হাতে পৌঁছানো গবেষণা আমাদের কাছে বেশি অর্থবহ। Drishtikon, বাংলাদেশের জন্য সংবাদ-পাঠের একটি প্ল্যাটফর্ম, এই ল্যাবের কাজের উপর গড়ে উঠেছে।
    body_en: >
      Research that reaches people matters more to us than research that stays on a shelf. Drishtikon, a news-literacy platform for Bangladesh, is built on this lab's work.

drishtikon:
  title_bn: "দৃষ্টিকোণ"
  title_en: "Drishtikon"
  body_bn: >
    Drishtikon একটি বাংলা সংবাদ-সাক্ষরতা প্ল্যাটফর্ম। প্রতিটি খবরের একাধিক উৎস, পক্ষপাতের মানচিত্র, এবং একটি কথোপকথনমূলক ইন্টারফেস যাতে পাঠক প্রশ্ন করতে পারেন। এটি BongLLaMA মডেলের উপর চলে, এবং আমাদের পক্ষপাত-সনাক্তকরণ গবেষণা ("Read Between the Lines") এই প্ল্যাটফর্মের মূল ভিত্তি।
    গবেষণাগার ও পণ্যের সংযোগ আমাদের কাছে একটি গুরুত্বপূর্ণ বিষয়। একটি মডেল কেবল বেঞ্চমার্কে ভালো করলেই যথেষ্ট নয়, সেটি মানুষের কাছে পৌঁছাতে হবে।
  body_en: >
    Drishtikon is a Bengali news-literacy platform with multiple sources per story, a bias map, and a conversational interface for readers to ask questions. It runs on BongLLaMA, and our bias-detection research ("Read Between the Lines") feeds the platform's core.
    The loop between the lab and the product matters to us: a model that scores well on benchmarks but never reaches readers isn't the outcome we're after.
  url: "https://drishtikon.life"
  parent_name: "Perspectivity"
  parent_url: "https://perspectivity.co"

join:
  body_bn: >
    আমরা সহযোগিতার জন্য উন্মুক্ত। ছাত্র, গবেষক, ইঞ্জিনিয়ার, কিংবা যারা বাংলা ভাষার প্রযুক্তি নিয়ে কাজ করতে চান, সবাইকে স্বাগত।
  body_en: >
    We're open to collaboration. Students, researchers, engineers, or anyone who wants to build Bangla-language technology with us.
