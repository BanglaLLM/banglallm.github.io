about:
  bn: >
    বেশিরভাগ এআই মডেল আগে ইংরেজির জন্য তৈরি হয়, বাংলা যোগ হয় অনেক পরে। ফলটা চোখে পড়ে। মডেল বাংলা নিয়ে কম জানে, বাংলায় সে আসলে কতটা ভালো কাজ করে তা মাপার ভালো উপায় প্রায় নেই, আর ইংরেজিতে যে নিরাপত্তা-প্রশিক্ষণ কাজ করে একই প্রশ্ন বাংলায় করলে সেটি প্রায়ই কাজ করা বন্ধ করে দেয়। BanglaLLM একটি স্বাধীন গবেষণা দল, আমরা এই সমস্যা নিয়ে কাজ করি। আমরা বাংলা ভাষার মডেল বানাই, সেগুলো শেখানোর ডেটা বানাই, আর সেগুলো যাচাই করার পরীক্ষা বানাই। সব কিছু যে কেউ বিনামূল্যে নামিয়ে ব্যবহার করতে পারেন।
  en: >
    Most AI models are built for English first, and Bangla gets added long afterwards. It shows. The models know less about Bangla, there is almost no good way to measure how well they actually handle it, and safety training that holds up in English often stops working when the same question is asked in Bengali. BanglaLLM is an independent research group working on that. We build Bangla language models, the data used to teach them, and the tests used to check them. Anyone can download and use all of it for free.

themes:
  - name_bn: "ভিত্তি-মডেল"
    name_en: "Foundation models"
    body_bn: >
      Llama আর Qwen-এর মতো উন্মুক্ত মডেল নিয়ে আমরা সেগুলোকে বাংলা লেখা দিয়ে আবার প্রশিক্ষণ দিই। এর মধ্যে আছে বাংলা হরফ আরও দক্ষভাবে পড়তে শেখানো, আর বাংলায় লেখা নির্দেশ মেনে চলতে শেখানো। BanglaLlama পরিবারে ১বি থেকে ১৩বি প্যারামিটারের মডেল আছে, প্রতিটি HuggingFace থেকে বিনামূল্যে নামানো যায়।
    body_en: >
      We take open models like Llama and Qwen and retrain them on Bangla text. That includes teaching them to read Bangla script more efficiently and to follow instructions written in Bangla. The BanglaLlama family runs from 1B to 13B parameters, and every size is free to download on HuggingFace.
  - name_bn: "নিরাপত্তা"
    name_en: "Safety"
    body_bn: >
      ইংরেজিতে দেওয়া নিরাপত্তা-প্রশিক্ষণ বাংলায় এসে টেকে না। আমাদের EMNLP 2026 Findings গবেষণা BanglaSafe-এ আমরা মডেলকে একই ক্ষতিকর প্রশ্ন করেছি, শুধু লেখার ধরন বদলে দিয়ে। খবরের কাগজের ভাষায় লিখলে সাধারণ খুদে বার্তার ভাষার চেয়ে ১৭.৫ পয়েন্ট বেশিবার মডেল উত্তর দিয়েছে। এই সমস্যা ধরার পরীক্ষা আমরা বানাই, আর ক্ষতির ধরনগুলো সাজাই বাংলাদেশের আইনে যা অপরাধ সেই অনুযায়ী।
    body_en: >
      Safety training done in English does not survive the trip to Bengali. In BanglaSafe, our EMNLP 2026 Findings paper, we asked models the same harmful question several ways and changed nothing but the writing style. Written like a newspaper article, it got answered 17.5 points more often than written like a casual text message. We build the tests that catch this, and we sort the harms by what Bangladeshi law actually treats as a crime.
  - name_bn: "মূল্যায়ন"
    name_en: "Evaluation"
    body_bn: >
      একটি মডেল বাংলায় কতটা ভালো, তা যাচাই করার মতো পরীক্ষা প্রায় নেই। আমরা সেই পরীক্ষাগুলো বানাচ্ছি: মডেল খবরে রাজনৈতিক পক্ষপাত ধরতে পারে কি না, বাংলায় গণিতের সমস্যা মেলাতে পারে কি না, আর বেশি সময় ভাবতে দিলে সে আরও ভালো করে কি না। পরীক্ষা চালানোর সরঞ্জামও উন্মুক্ত।
    body_en: >
      If you want to know whether a model is any good at Bangla, there is very little to test it with. We are building those tests: whether a model can spot political slant in news, whether it can work through a math problem in Bangla, and whether it gets better when you give it more time to think. The tools to run them are open too.
  - name_bn: "ডেটা"
    name_en: "Data"
    body_bn: >
      একটি মডেল যত ভালো লেখা থেকে শেখে, ততটাই ভালো হয়। বাংলার জন্য সেই লেখার বেশিরভাগই তৈরি অবস্থায় ছিল না, তাই আমরা নিজেরাই বানিয়েছি। আমরা বাংলা খবর সংগ্রহ করি, নির্দেশনার ডেটাসেট বাংলায় অনুবাদ করি (Bangla-Alpaca ও Bangla-Orca), আর গণিতের ডেটাসেট বানাই। সবই উন্মুক্ত।
    body_en: >
      A model is only as good as the text it learns from, and for Bangla most of that text did not exist in usable form, so we made it. We collect Bangla news, translate instruction datasets into Bangla (Bangla-Alpaca and Bangla-Orca), and build math datasets. All of it is public.
  - name_bn: "গবেষণা থেকে পণ্যে"
    name_en: "Research to product"
    body_bn: >
      কাজটা কাগজে পড়ে না থেকে মানুষের ব্যবহারে আসুক, আমরা সেটাই চাই। Drishtikon একটি অ্যাপ, যেখানে বাংলাদেশের পাঠক দেখতে পান একই খবর ভিন্ন ভিন্ন সংবাদমাধ্যম কীভাবে দিচ্ছে। এটি এই ল্যাবের কাজের উপর তৈরি।
    body_en: >
      We would rather the work end up in something people use than sit in a paper. Drishtikon, an app that lets Bangladeshi readers compare how different outlets covered the same story, is built on this lab's work.

drishtikon:
  title_bn: "দৃষ্টিকোণ"
  title_en: "Drishtikon"
  body_bn: >
    Drishtikon একই খবর একাধিক সংবাদমাধ্যম কীভাবে দিয়েছে তা পাশাপাশি দেখায়, কোন মাধ্যম কোন দিকে ঝুঁকে আছে তা চিহ্নিত করে, আর পাঠক যা পড়ছেন তা নিয়ে প্রশ্ন করতে পারেন। এটি BongLLaMA মডেলে চলে। পক্ষপাত চিহ্নিত করার কাজটি আসে আমাদের "Read Between the Lines" গবেষণা থেকে।
    এটি বানাতে গিয়ে আমাদের সৎ থাকতে হয়। বেঞ্চমার্কে ভালো নম্বর পাওয়া সহজ, কিন্তু তাতে এমন কিছুও তৈরি হতে পারে যা কেউ ব্যবহার করতে পারে না।
  body_en: >
    Drishtikon puts several outlets' coverage of the same story side by side, marks where each one leans politically, and lets readers ask questions about what they are reading. It runs on BongLLaMA. The political slant marking comes out of our paper "Read Between the Lines".
    Building it keeps us honest. Scoring well on a benchmark is easy enough, and you can still end up with something nobody can use.
  url: "https://drishtikon.life"
  parent_name: "Perspectivity"
  parent_url: "https://perspectivity.co"

join:
  body_bn: >
    আমরা ছাত্র, গবেষক ও ইঞ্জিনিয়ারদের সঙ্গে কাজ করি। বাংলা ভাষার প্রযুক্তি তৈরিতে যিনিই হাত লাগাতে চান, তাঁর কাছ থেকে শুনতে আমরা আগ্রহী।
  body_en: >
    We work with students, researchers, and engineers, and we are glad to hear from anyone who wants to help build Bangla language technology.
